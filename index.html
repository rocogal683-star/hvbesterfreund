let userAnswers = {};
let score = 0;

function renderQuiz() {
    const container = document.getElementById('quizContainer');
    container.innerHTML = '';

    quizData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${index}`;

        const optionsHTML = item.options.map((opt, optIndex) => `
            <button class="option-btn" 
                    id="opt-${index}-${optIndex}" 
                    onclick="selectOption(${index}, ${optIndex})">
                ${opt}
            </button>
        `).join('');

        card.innerHTML = `
            <div class="question-header">
                <div class="avatar">
                    <img src="${item.image}" alt="Person ${index + 1}">
                </div>
                <div class="person-info">
                    <div class="person-tag">Frage ${index + 1} von 22</div>
                    <div class="friend-name">${item.friend}</div>
                </div>
                <a href="${item.ytUrl}" target="_blank" class="yt-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    Bei ${item.time} ansehen
                </a>
            </div>
            <div class="question-text">${item.question}</div>
            <div class="options-grid">
                ${optionsHTML}
            </div>
            <div class="feedback-box" id="feedback-${index}">
                <div id="feedback-text-${index}"></div>
                <div style="margin-top: 6px;"><strong>Erklärung (DE):</strong> ${item.explanation_de}</div>
                <div style="margin-top: 4px; color: #475569;"><strong>Explicación (ES):</strong> ${item.explanation_es}</div>
                <div class="vocab-box">
                    <div class="vocab-title">Wortschatz / Vocabulario:</div>
                    <div>${item.vocab}</div>
                </div>
            </div>
        `;
        container.appendChild(card);
    });
}

function selectOption(qIndex, optIndex) {
    if (userAnswers[qIndex] !== undefined) return;

    userAnswers[qIndex] = optIndex;
    const item = quizData[qIndex];
    const isCorrect = optIndex === item.correct;

    if (isCorrect) score++;

    item.options.forEach((_, i) => {
        const btn = document.getElementById(`opt-${qIndex}-${i}`);
        btn.disabled = true;
        if (i === item.correct) {
            btn.classList.add('selected-correct');
        } else if (i === optIndex && !isCorrect) {
            btn.classList.add('selected-incorrect');
        }
    });

    const feedbackBox = document.getElementById(`feedback-${qIndex}`);
    const feedbackText = document.getElementById(`feedback-text-${qIndex}`);
    
    feedbackBox.classList.add('show');
    if (isCorrect) {
        feedbackBox.classList.add('feedback-correct');
        feedbackText.innerHTML = '<strong>Richtig! / ¡Correcto!</strong>';
    } else {
        feedbackBox.classList.add('feedback-incorrect');
        feedbackText.innerHTML = '<strong>Leider falsch / Incorrecto.</strong>';
    }

    const answeredCount = Object.keys(userAnswers).length;
    document.getElementById('answeredCount').innerText = answeredCount;
    document.getElementById('scoreCount').innerText = score;
    document.getElementById('progressBar').style.width = `${(answeredCount / quizData.length) * 100}%`;

    if (answeredCount === quizData.length) {
        showFinalResults();
    }
}

function showFinalResults() {
    const resultsCard = document.getElementById('resultsCard');
    const finalScore = document.getElementById('finalScore');
    const finalMessage = document.getElementById('finalMessage');

    finalScore.innerText = `${score} / ${quizData.length}`;

    if (score === 22) {
        finalMessage.innerText = 'Perfekt! Du hast alles auf Deutsch verstanden!';
    } else if (score >= 17) {
        finalMessage.innerText = 'Sehr gut! Dein Hörverstehen auf B1-Niveau ist stark.';
    } else if (score >= 11) {
        finalMessage.innerText = 'Gute Leistung! Du kannst das Video noch einmal mit Untertiteln ansehen.';
    } else {
        finalMessage.innerText = 'Nicht schlimm! Übung macht den Meister. Versuch es noch einmal!';
    }

    resultsCard.style.display = 'block';
    resultsCard.scrollIntoView({ behavior: 'smooth' });
}

function restartQuiz() {
    userAnswers = {};
    score = 0;
    document.getElementById('answeredCount').innerText = '0';
    document.getElementById('scoreCount').innerText = '0';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('resultsCard').style.display = 'none';
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuiz();
</script>
